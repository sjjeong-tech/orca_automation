{
  "version": "0.4.0",
  "purpose": "고유번호증 신청 자연어 요청을 승인 후 Notion 업무요청·Task 실행 인스턴스로 변환하는 Pilot 계약",
  "status": "CI2_PROCESS_ALIGNED_CONTRACT",
  "supported_interfaces": [
    {"id": "CODEX_COMMAND", "priority": 1, "status": "PROTOTYPE"},
    {"id": "CLAUDE_CODE_SKILL", "priority": 1, "status": "REUSABLE_FUTURE_INTERFACE"},
    {"id": "GPT_DIRECT", "priority": 2, "status": "PLANNED"},
    {"id": "SLACK", "priority": 3, "status": "DEFERRED_TO_CI_06"},
    {"id": "NOTION_FORM", "priority": 4, "status": "OPTIONAL_FALLBACK"}
  ],
  "pilot_scope": {
    "supported_request_types": ["고유번호증 신청"],
    "excluded_request_types": ["보안카드·홈택스", "계좌개설", "계좌개설 보완", "명판·인감", "고유번호증 정정", "폐업·청산"],
    "batch_creation": false
  },
  "process_reference": {
    "mapping_source": "contracts/process-execution-mapping.yaml",
    "required_fields": ["e2e_process_id", "process_model_id", "operational_task_set_id", "atomic_step_refs"],
    "unsupported_request_type_action": "BLOCK_COMMIT"
  },
  "request_common_fields": [
    "related_fund", "request_type", "requester", "fund_manager", "target_date", "urgent",
    "document_status", "current_actor", "next_action", "blocker", "transaction_id",
    "e2e_process_id", "process_model_id"
  ],
  "required_fields": ["related_fund", "request_type", "requester", "fund_manager", "document_status"],
  "optional_fields": ["target_date", "urgent", "original_folder", "notes"],
  "conditional_fields": [
    "fund_type", "gp_type", "joint_gp", "fund_name", "fund_address",
    "regulation_version_status", "trigger_status", "supporting_document_status",
    "detail_statement_status", "sealed_document_status", "source_document_status", "exception_notes"
  ],
  "normalization_rules": {
    "request_type": {"고유번호증": "고유번호증 신청", "고유번호증 신청": "고유번호증 신청"},
    "document_status": {"전달 완료": "DELIVERED", "일부 전달": "PARTIAL", "미전달": "NOT_DELIVERED"},
    "urgent": {"긴급": true, "급함": true, "negative_expression_precedence": true, "default": false},
    "unknown_value": "CONFIRMATION_REQUIRED",
    "sensitive_data": "REJECT_AND_DO_NOT_STORE"
  },
  "missing_information_rules": {
    "required_action": "ASK_AND_BLOCK_WRITE",
    "optional_action": "ALLOW_EMPTY_AND_SHOW_MISSING_IN_PREVIEW",
    "max_questions_per_turn": 3,
    "questions": {
      "related_fund": "관련 조합을 정확히 알려주세요.",
      "request_type": "요청할 업무 유형을 알려주세요.",
      "requester": "요청자를 알려주세요.",
      "fund_manager": "담당 관리역을 알려주세요.",
      "document_status": "서류 전달 상태(미전달/일부 전달/전달 완료)를 알려주세요."
    }
  },
  "fund_resolution": {
    "zero_matches": "BLOCK_AND_ASK",
    "one_exact_match": "SELECT",
    "multiple_matches": "BLOCK_AND_REQUIRE_USER_SELECTION",
    "fuzzy_auto_select": false
  },
  "person_resolution": {
    "exactly_one_workspace_match": "SELECT",
    "zero_or_multiple_matches": "BLOCK_AND_ASK",
    "text_fallback": false
  },
  "duplicate_detection": {
    "keys": ["related_fund", "request_type", "incomplete_status"],
    "incomplete_statuses": ["시작 전", "진행 중"],
    "on_candidate": "WARN_AND_REQUIRE_EXPLICIT_DUPLICATE_APPROVAL",
    "automatic_merge": false
  },
  "record_creation_gate": {
    "required": [
      "required_fields_complete", "fund_exactly_resolved", "people_exactly_resolved",
      "supported_request_type", "canonical_process_mapping_exists", "explicit_approval"
    ],
    "approval_tokens": ["승인", "생성", "확인 완료"],
    "automation_flag": "--approve",
    "write_before_gate": false,
    "draft_record_before_gate": false
  },
  "transaction_policy": {
    "stages": ["PREPARE", "PREVIEW", "COMMIT"],
    "prepare": {
      "allowed_actions": ["PARSE", "RESOLVE_FUND", "RESOLVE_PERSON", "CHECK_DUPLICATE", "RESOLVE_PROCESS_MAPPING"],
      "notion_write_count": 0
    },
    "preview": {
      "existing_fund": "SHOW_EXISTING_PAGE_ID",
      "missing_fund": "SHOW_CREATE_ON_COMMIT",
      "show_planned_writes": ["FUND", "REQUEST", "TASK"],
      "notion_write_count": 0
    },
    "commit": {
      "requires_explicit_approval": true,
      "order": ["CREATE_OR_REUSE_FUND", "REREAD_FUND_ID", "CREATE_REQUEST", "VERIFY_REQUEST_FUND_RELATION", "CREATE_TASKS", "VERIFY_TASK_RELATION_AND_ROLLUP"]
    },
    "failure_control": {
      "fund_failure": "STOP_ALL",
      "request_failure": "DO_NOT_CREATE_TASKS",
      "partial_task_failure": "LOG_CREATED_AND_MISSING_TASKS",
      "retry": "REUSE_TRANSACTION_LOG_AND_CREATE_MISSING_ONLY",
      "automatic_operational_delete": false,
      "test_compensation_delete": "EXPLICIT_CONDITION_ONLY"
    },
    "idempotency": {
      "key": "transaction_id",
      "record_page_ids_in_execution_log": true,
      "duplicate_create_on_retry": false
    }
  },
  "notion_property_mapping": {
    "request_database": "지원팀 업무요청",
    "request": {
      "title": "요청명", "related_fund": "관련 조합", "request_type": "요청 업무 유형",
      "requester": "요청자", "fund_manager": "담당 관리역", "target_date": "목표일",
      "document_status": "실물서류 전달 여부", "original_folder": "원본 폴더",
      "notes": "특이사항", "status": "요청 상태", "tasks": "관련 Task"
    },
    "task_database": "지원팀 Task",
    "task": {
      "title": "Task명", "parent_request": "상위 요청", "related_fund": "관련 조합",
      "process_id": "Process ID", "operational_task_id": "Operational Task ID",
      "status": "Task 상태", "assignee": "담당자", "actor": "현재 Actor",
      "target_date": "목표일", "next_action": "다음 Action", "blocker": "Blocker",
      "completion_condition": "완료조건", "evidence": "완료증빙", "notes": "비고"
    },
    "prototype_encoding": {
      "request_current_actor": "요청 내용의 구조화 Text",
      "request_next_action": "요청 내용의 구조화 Text",
      "request_blocker": "특이사항의 구조화 Text"
    }
  },
  "task_generation_policy": {
    "request_type": "고유번호증 신청",
    "mapping_source": "contracts/process-execution-mapping.yaml",
    "task_count": 6,
    "atomic_task_expansion": false
  },
  "request_body_template": {
    "path": "templates/request-execution-template.md",
    "default_apply": false,
    "test_apply_allowed": true,
    "operational_apply_requires_separate_approval": true,
    "notion_schema_change_required": false
  },
  "evidence_policy": {
    "actual_files_location": "GOOGLE_DRIVE",
    "git_storage": "NON_SENSITIVE_PATH_OR_METADATA_ONLY",
    "notion_storage": "PATH_OR_NON_SENSITIVE_METADATA"
  },
  "error_handling": {
    "unsupported_process_mapping": "BLOCK_COMMIT",
    "notion_write_failure": "STOP_AND_REPORT_CREATED_RECORDS",
    "partial_task_creation": "MARK_TEST_INCOMPLETE_AND_STOP",
    "missing_permission": "STOP_MISSING_INPUT",
    "unexpected_schema": "STOP_FOR_SCHEMA_REVIEW"
  }
}
