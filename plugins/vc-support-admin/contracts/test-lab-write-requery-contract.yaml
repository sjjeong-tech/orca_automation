version: 1
name: test-lab-write-requery
write_mode: test_write
environment: TEST_LAB
approval_required_fields: [approval_id, actor, transaction_id, write_scope, preview_hash, expires_at, explicit_approval]
guards: [environment, approval, transaction_id, duplicate_exact_0, data_source_allowlist, operating_write_disabled]
sequence: [preview, approval, guard, duplicate_check, request_write, request_requery, relation_verify, task_writes, task_requery, expected_actual]
fail_closed_codes: [PARTIAL_WRITE, PROVIDER_ERROR, REQUERY_FAILED, EXPECTED_ACTUAL_MISMATCH, BLOCKED_BY_GUARD]
operational_write_count: 0
runtime_snapshot: {source: [APPROVED_SESSION, SESSION_TOOL_BRIDGE], environment: TEST_LAB, data_source_allowlist: TEST_LAB_ONLY, required_checks: [schema, environment, allowlist, transaction, record_count, relation, sanitization, integrity]}
session_snapshot: {input_schema: plugins/vc-support-admin/schemas/session-tool-read-packet.schema.json, source: SESSION_TOOL_READ, adapter: kernel/session-snapshot-transport-adapter.mjs, read_only: true, raw_mcp_storage: forbidden}
