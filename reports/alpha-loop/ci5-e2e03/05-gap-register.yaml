retries_executed: 0
retry_rationale: >
  Baseline이 Blocking 실패 없이 종료되어 Notion Record 재실행 형태의 재시도가
  필요하지 않았다. 유일한 비차단 관찰 사항은 Baseline 설계 단계에서 이미
  운영 관행으로 우회 처리됐고, 그 처리 결과가 실제 Record에 정확히 반영됐음을
  Reviewer가 확인했다.

gaps:
  - gap_id: CI5-G01
    type: CONVERSATION_FLOW_GAP
    발생_phase: Phase 2 (P03-T02)
    description: >
      Request `서류 상태` Select는 `일부 전달`과 `보완 필요`가 동시에 참인 상태를
      하나의 값으로 표현하지 못한다(수령 범위와 검수 결과 판정이라는 서로 다른 축).
    user_dialogue_example: "서류 일부 도착했어요." → (검수 후) 누락 발견
    current_representation: >
      서류 상태를 `보완 필요`로 전환하고, 실제 수령 범위(예: 전체 3건 중 2건)는
      Task Blocker 텍스트에 구조화 형식으로 병기.
    structural_alternative: >
      서류 상태를 다차원(수령 범위 축 + 검수 결과 축)으로 분리하는 신규 Property를
      만들 수도 있으나, 이번 알파에서는 신규 Property를 제안하지 않는다.
    minimum_change_candidate: >
      Contract·Mapping 문서에 "서류 상태가 `보완 필요`로 전환될 때는 Blocker에
      `누락서류: {서류명} {건수}(전체 {총건수} 중 {수령건수} 수령)` 형식을 반드시
      병기한다"는 운영 관행(Convention)을 명문화. Schema 변경 아님.
    recurrence_count: 1
    operational_impact: "낮음 — 현재 관행으로 정보 손실 없이 우회 가능함을 실측 확인"
    confirmation_needed: "베타에서 실제 사례로 이 관행이 일관되게 지켜지는지 관찰 필요"
    severity: FAIL_NONBLOCKING

  - gap_id: CI5-G02
    type: TOOL_LIMITATION
    발생_phase: 전 Phase 공통(UI Checkpoint)
    description: >
      Chrome 등 브라우저 UI 자동화 도구가 이번 세션에 연결되어 있지 않아
      TAP이 요청한 6개 UI Checkpoint를 Notion API 조회로 대체했다.
    current_representation: "notion-fetch/notion-query-data-sources API 조회로 대체 수행"
    minimum_change_candidate: "다음 TAP 실행 전 Chrome 연동 도구 제공 여부 확인 필요"
    recurrence_count: 6
    operational_impact: "Rollup 표시값 UI 육안검증만 제한, Relation·상태·Actor·Blocker 등 나머지 전부 API로 확인 가능해 실질 영향 낮음"
    confirmation_needed: "N-06과 동일 — 향후 Chrome 연동 시 1회 육안 확인 권고"
    severity: NOT_VERIFIABLE

  - gap_id: CI5-G03
    type: NOT_VERIFIABLE
    발생_phase: Phase 전체(Task 관련 조합 Rollup)
    description: >
      신규 생성한 Task(예: P03-T01)의 `관련 조합` Rollup 값이 API에서
      `<omitted />`로 반환됨 — CI2·CI4와 동일한 구조적 제한.
    current_representation: "Relation 경로(상위 요청→Request→관련 조합)는 Schema로 확인, 표시값만 미확인"
    minimum_change_candidate: "없음(기존 N-06 결론 재확인일 뿐, 신규 Schema 제안 아님)"
    recurrence_count: 1
    operational_impact: "낮음 — Relation 무결성 자체는 확인됨"
    confirmation_needed: "Chrome UI 연동 시 1건 육안 재확인 권고(CI4-G02와 동일 후속 조치)"
    severity: NOT_VERIFIABLE

