    assumed_context: "담당 관리역 미언급"
    expected_extracted_fields: [related_fund=테일프론티어투자조합3호, request_type=고유번호증 신청, requester=김지원, document_status=준비됨]
    expected_missing_fields: [fund_manager]
    expected_follow_up_question: "담당 관리역이 누구인가요?"
    expected_fund_resolution: SINGLE_MATCH
    expected_person_resolution: "requester만 SINGLE_MATCH, fund_manager UNRESOLVED"
    expected_date_resolution: NOT_APPLICABLE
    expected_duplicate_result: NOT_EVALUATED_BEFORE_COMPLETE
    write_allowed: "NO"
    expected_notion_result: "Write 0건, WAITING_FOR_INPUT 상태 유지"
    risk_level: CRITICAL
    failure_meaning: "필수 담당자 없이 생성되면 HA-01/HA-04/HA-05/HA-06/HA-08 승인 주체가 공백이 된다"

