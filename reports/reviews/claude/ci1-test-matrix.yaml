    expected_extracted_fields: [related_fund=테일프론티어투자조합3호, request_type=고유번호증 신청, requester=김지원, fund_manager=박관리, target_date=2026-08-15, document_status=미준비]
    expected_missing_fields: []
    expected_follow_up_question: "없음(선택정보 미언급은 질문 대상 아님)"
    expected_fund_resolution: SINGLE_MATCH
    expected_person_resolution: SINGLE_MATCH_BOTH
    expected_date_resolution: ABSOLUTE_RESOLVED
    expected_duplicate_result: NO_DUPLICATE_FOUND
    write_allowed: AFTER_EXPLICIT_APPROVAL_ONLY
    expected_notion_result: "승인 후 Request 1건 + OT-P03-01~05 Task 5건 생성, Request-Task 상호 Relation 연결"
    risk_level: LOW
    failure_meaning: "기본 정상 경로가 실패하면 나머지 모든 시나리오의 전제가 무효화된다"

